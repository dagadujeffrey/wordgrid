<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WordGrid – Tactical Word Strategy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="brand">
          <h1>WordGrid</h1>
          <span>Strategic 4×4 word battles – local, online, or against adaptive AI.</span>
        </div>
        <div class="flex" id="auth-actions"></div>
      </header>

      <main class="grid-layout">
        <section class="card" id="auth-panel"></section>
        <section class="card" id="game-setup"></section>
        <section class="card" id="board-panel"></section>
        <section class="card" id="summary-panel"></section>
        <section class="card" id="leaderboard-panel"></section>
      </main>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
